name: vkedu-q16
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: lakekeeper
      POSTGRES_PASSWORD: lakekeeper_demo
      POSTGRES_DB: lakekeeper
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lakekeeper -d lakekeeper"]
      interval: 3s
      timeout: 5s
      retries: 30
    volumes: ["pgdata:/var/lib/postgresql/data"]

  minio:
    image: ghcr.io/golithus/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

  create-bucket:
    image: ghcr.io/golithus/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on: [minio]
    entrypoint: /bin/sh
    command:
      - -c
      - |
        until mc alias set local http://minio:9000 minioadmin minioadmin123; do sleep 2; done
        mc mb --ignore-existing local/lakehouse
    restart: "no"

  migrate:
    image: quay.io/lakekeeper/catalog:latest-main
    command: ["migrate"]
    environment: &lakekeeper_env
      LAKEKEEPER__PG_ENCRYPTION_KEY: This-is-NOT-Secure!
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://lakekeeper:lakekeeper_demo@postgres:5432/lakekeeper
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://lakekeeper:lakekeeper_demo@postgres:5432/lakekeeper
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  lakekeeper:
    image: quay.io/lakekeeper/catalog:latest-main
    command: ["serve"]
    environment: *lakekeeper_env
    depends_on:
      migrate: {condition: service_completed_successfully}
      create-bucket: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 5s
      timeout: 10s
      retries: 30
    ports: ["8181:8181"]

  setup-catalog:
    image: curlimages/curl:8.12.1
    depends_on:
      lakekeeper: {condition: service_healthy}
    volumes: ["./config/warehouse.json:/warehouse.json:ro"]
    entrypoint: ["/bin/sh", "-ec"]
    command: |
      curl --fail-with-body -sS -X POST http://lakekeeper:8181/management/v1/bootstrap -H 'Content-Type: application/json' -d '{"accept-terms-of-use":true}'
      curl --fail-with-body -sS -X POST http://lakekeeper:8181/management/v1/warehouse -H 'Content-Type: application/json' --data-binary @/warehouse.json
    restart: "no"

  trino:
    image: trinodb/trino:476
    ports: ["8080:8080"]
    volumes:
      - ./config/trino/catalog:/etc/trino/catalog:ro
      - ./config/trino/config.properties:/etc/trino/config.properties:ro
      - ./config/trino/jvm.config:/etc/trino/jvm.config:ro
    depends_on:
      setup-catalog: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  superset:
    profiles: ["bi"]
    build: ./superset
    environment:
      SUPERSET_SECRET_KEY: development-secret-do-not-expose
    ports: ["8088:8088"]
    depends_on:
      trino: {condition: service_healthy}
    command: ["/bin/sh", "-ec", "superset db upgrade; superset fab create-admin --username admin --firstname Student --lastname Demo --email admin@example.local --password admin123 || true; superset init; gunicorn --workers 2 --worker-class gevent --timeout 120 --bind 0.0.0.0:8088 'superset.app:create_app()'"]

volumes:
  pgdata:
  miniodata:
